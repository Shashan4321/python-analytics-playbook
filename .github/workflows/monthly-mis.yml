name: Monthly MIS report

on:
  schedule:
    - cron: "30 3 1 * *" # 09:00 IST on the 1st of every month
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python examples/generate_mis_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: MIS_Report
          path: reports/MIS_Report.xlsx
          retention-days: 30
